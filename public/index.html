<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MyVault</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >
<link
  rel="manifest"
  href="manifest.json"
/>
</head>

<body>


  <!-- LOGIN SCREEN -->

  <div id="loginScreen">

    <div class="login-box">

      <div class="login-logo">
        🌸
      </div>

      <h2>MyVault</h2>

      <div class="demo-box">

        <strong>
          Demo Password
        </strong>

        <br><br>

        🔑 1234

      </div>

      <div class="input-group">

        <label>
          PASSWORD
        </label>

        <input
          type="password"
          id="passwordInput"
          placeholder="••••••••"
        >

      </div>

      <button
        class="login-btn"
        onclick="login()"
      >
        Open your vault →
      </button>

    </div>

  </div>



  <!-- MAIN APP -->

  <div
    class="container"
    id="mainApp"
    style="display:none;"
  >

    <!-- TOP BAR -->

    <div class="top-bar">

      <div class="brand">

        <h1>✨ My Vault</h1>

        <p class="subtitle">
          Save your memories forever
        </p>

      </div>

      <button
        id="logoutBtn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- UPLOAD BOX -->

    <div
      class="upload-box"
      id="dropArea"
    >

      <p>
        📂 Drag & Drop Files Here
      </p>

      <input
        type="file"
        id="fileInput"
      >

    </div>


    <!-- GALLERY -->

    <div id="gallery"></div>

  </div>



  <!-- IMAGE MODAL -->

  <div id="modal">

    <span id="closeModal">
      ✖
    </span>

    <img id="modalImg">

  </div>



  <script>

    // LOGIN

    function login() {

      const password =

        document.getElementById(
          "passwordInput"
        ).value;

      if (password === "1234") {

        document.getElementById(
          "loginScreen"
        ).style.display = "none";

        document.getElementById(
          "mainApp"
        ).style.display = "block";

      } else {

        alert(
          "Wrong Password"
        );
      }
    }


    // LOGOUT

    function logout() {

      document.getElementById(
        "loginScreen"
      ).style.display = "flex";

      document.getElementById(
        "mainApp"
      ).style.display = "none";
    }

  </script>


  <script src="script.js"></script>

</body>

</html>

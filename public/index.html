<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MyVault</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

</head>

<body>


  <!-- LOGIN SCREEN -->

  <div id="loginScreen">

    <div class="login-box">

      <div class="login-logo">
        🌸
      </div>

      <h2>MyVault</h2>
      <br>

      <p class="subtitle">
        Your private cloud gallery
      </p>
      <br>

      <button
        class="login-btn"
        onclick="googleLogin()"
      >
        Continue with Google →
      </button>

    </div>

  </div>



  <!-- MAIN APP -->

  <div
    class="container"
    id="mainApp"
    style="display:none;"
  >

    <!-- TOP BAR -->

    <div class="top-bar">


      <!-- USER INFO -->

      <div id="userInfo">

        <img id="userPhoto">

        <div>

          <h3 id="userName"></h3>

          <p id="userEmail"></p>

        </div>

      </div>


      <!-- BRAND -->

      <div class="brand">

        <h1>✨ My Vault</h1>
        <br>

        <p class="subtitle">
          Save your memories forever
        </p>

      </div>


      
        <!-- LOGOUT -->

      <button
        id="logoutBtn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>
<select id="folderSelect">

  <option value="travel">
    Travel
  </option>

  <option value="personal">
    Personal
  </option>

  <option value="college">
    College
  </option>

  <option value="secret">
    Secret
  </option>

</select>


    <!-- UPLOAD BOX -->

    <div
      class="upload-box"
      id="dropArea"
    >

      <p>
        📂 Drag & Drop Files Here
      </p>

      <input
        type="file"
        id="fileInput"
      >

    </div>



    <!-- GALLERY -->

    <div id="gallery"></div>

  </div>



  <!-- IMAGE MODAL -->

  <div id="modal">

    <span id="closeModal">
      ✖
    </span>

    <img id="modalImg">

  </div>



  <!-- FIREBASE -->

  <script
    type="module"
    src="firebase.js"
  ></script>



  <!-- MAIN SCRIPT -->

 <script
  type="module"
  src="script.js"
></script>

</body>

</html>
